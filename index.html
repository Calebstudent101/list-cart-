  <h1 id="desserts">Desserts</h1>

        <div class="position-relative">
          <button class="add-to-cart">
            <img class="add-to-cart-img" src="./assets/images/icon-add-to-cart.svg" alt="Add to cart">
            Add to cart

        </div>
        <div class="dessert-info-container">
          <p>Waffle</p>
          <p>Waffle with Berries</p>
          <p>$6.50</p>
        </div>
      </div>
